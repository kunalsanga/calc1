<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="calculator-container">
        <div class="calculator">
            <div class="display-controls">
                <button class="btn history-toggle" onclick="toggleHistory()">&#x1F4C5;</button>
                <button class="btn memory-clear" onclick="memoryClear()">MC</button>
                <button class="btn memory-recall" onclick="memoryRecall()">MR</button>
                <button class="btn memory-add" onclick="memoryAdd()">&#43;</button>
                <button class="btn memory-subtract" onclick="memorySubtract()">&#45;</button>
            </div>
            <div class="display" id="display">0</div>
            <div class="buttons">
                <button class="btn clear" onclick="clearDisplay()">C</button>
                <button class="btn operator" onclick="deleteLast()">DEL</button>
                <button class="btn operator" onclick="toggleSign()">+/-</button>
                <button class="btn operator" onclick="appendOperator('/')">/</button>

                <button class="btn number" onclick="appendNumber('7')">7</button>
                <button class="btn number" onclick="appendNumber('8')">8</button>
                <button class="btn number" onclick="appendNumber('9')">9</button>
                <button class="btn operator" onclick="appendOperator('*')">×</button>

                <button class="btn number" onclick="appendNumber('4')">4</button>
                <button class="btn number" onclick="appendNumber('5')">5</button>
                <button class="btn number" onclick="appendNumber('6')">6</button>
                <button class="btn operator" onclick="appendOperator('-')">-</button>

                <button class="btn number" onclick="appendNumber('1')">1</button>
                <button class="btn number" onclick="appendNumber('2')">2</button>
                <button class="btn number" onclick="appendNumber('3')">3</button>
                <button class="btn operator" onclick="appendOperator('+')">+</button>

                <button class="btn number zero-btn" onclick="appendNumber('0')">0</button>
                <button class="btn number" onclick="appendNumber('.')">.</button>
                <button class="btn equals" onclick="calculate()">=</button>
                <button class="btn operator" onclick="percentage()">%</button>
            </div>
            <div class="additional-controls">
                <button class="btn memory-recall active" onclick="memoryRecall()">MR</button>
                <button class="btn" onclick="clearHistory()">C H</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
